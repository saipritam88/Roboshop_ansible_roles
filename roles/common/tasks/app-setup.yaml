---
- name: create application user
  ansible.builtin.user:
    name: roboshop
    comment: " Roboshop Application User"
    state: present
    shell: /bin/bash
    home: /app

- name: remove app directory if exists
  ansible.builtin.file:
    path: /app
    state: absent
  
- name: create app directory
  ansible.builtin.file:
    path: /app
    state: directory

- name: delete {{ component }} file
  ansible.builtin.file:
    path: /tmp/{{ component }}.zip
    state: absent

- name: downaload application code
  ansible.builtin.get_url:
    url: "https://roboshop-artifacts.s3.amazonaws.com/{{ component }}-v3.zip"
    dest: /tmp/{{ component }}.zip

- name: extract {{ component }} application
  ansible.builtin.unarchive:
    src: /tmp/{{ component }}.zip
    dest: /app
    remote_src: yes